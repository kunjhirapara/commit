name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_STREAM_API_KEY=${{ secrets.NEXT_PUBLIC_STREAM_API_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            DOCKER_GID=${{ vars.DOCKER_GID || '999' }}

      # Tells Portainer to pull the image just pushed and recreate the stack.
      # Until now this was commented out, so every merge built an image that then
      # sat in GHCR waiting for someone to press redeploy by hand.
      #
      # Inert until PORTAINER_WEBHOOK_URL is set: the step is skipped rather than
      # failing, so a fork or a repo without the secret still gets a green build.
      # Create the webhook in Portainer under Stacks → commit → Webhooks, then
      # add the URL as a repository secret.
      - name: Redeploy on Portainer
        # Passed as env rather than interpolated into the run block: the webhook
        # URL carries its own auth token, and `${{ }}` inside a shell command can
        # end up in logs via `set -x` or an error trace.
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PORTAINER_WEBHOOK_URL:-}" ]; then
            echo "::notice::PORTAINER_WEBHOOK_URL is not set, so the VM was not redeployed."
            echo "::notice::The image is in GHCR — pull it in Portainer, or add the secret to automate this."
            exit 0
          fi

          # --fail-with-body so an HTTP error fails the deploy rather than
          # passing silently, which is how a stale VM goes unnoticed for weeks.
          status=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 120 \
            --output /dev/stderr --write-out '%{http_code}' \
            -X POST "$PORTAINER_WEBHOOK_URL")

          echo "Portainer webhook accepted the redeploy (HTTP $status)."
