name: Deploy

on:
  push:
    branches:
      - main

# Two merges in quick succession used to start two concurrent runs, and both were
# wrong in ways that are easy to miss. They race to push the same :latest tag, so
# the winner is whichever build finishes last rather than whichever commit is
# newest; and verify-rollout below polls for its own commit for twelve minutes,
# which a superseded run can never see, so it fails at the deadline and blames the
# VM for a rollout that was simply overtaken.
#
# cancel-in-progress stays false on purpose. Cancelling mid-run can interrupt
# `convex deploy` partway through a schema change or a docker push partway through
# a manifest; queueing only ever costs wall-clock, on a repo that deploys a handful
# of times a day. Do not "fix" this to true.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Convex is deployed BEFORE the image is pushed, and the ordering is the
      # whole point of this step's position.
      #
      # Watchtower on the VM pulls a new :latest as soon as it appears, so the
      # frontend can reach users without anyone pressing anything. The frontend
      # calls Convex functions by name, so an image that ships ahead of its
      # backend fails on whatever it added — a missing query is a broken
      # dashboard, not a graceful degradation. Deploying here means the backend
      # is always live before the image that depends on it exists in the
      # registry.
      #
      # If this fails, the image is never pushed. That is deliberate: a failed
      # backend deploy should stop the rollout, not race it.
      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_DEPLOY_KEY is not set, so Convex was not deployed."
            echo "::warning::The image will still ship. If it calls functions this deployment lacks, those screens will break — deploy Convex by hand before this image reaches the VM."
            exit 0
          fi

          npm ci --no-audit --no-fund

          # Non-interactive because CONVEX_DEPLOY_KEY is set. Typecheck is
          # already enforced by ci.yml on the PR, so skip the duplicate pass.
          npx convex deploy --typecheck disable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_STREAM_API_KEY=${{ secrets.NEXT_PUBLIC_STREAM_API_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            DOCKER_GID=${{ vars.DOCKER_GID || '999' }}
            BUILD_SHA=${{ github.sha }}

      - name: Summary
        run: |
          echo "::notice::Image pushed to ghcr.io/${{ github.repository }}:latest."
          echo "::notice::Publishing is not deploying — verify-rollout checks whether the VM actually picked it up."

  # Publishing an image is not the same as shipping it, and until this job
  # existed nothing told the difference. A fix for robots.txt, the OG image and
  # a broken auth redirect merged, built, and showed green here while the VM
  # kept serving the previous container for hours — the workflow's own summary
  # claimed "no manual redeploy needed", which was untrue because Watchtower had
  # never been started on the box.
  #
  # This polls the public health endpoint until it reports the commit that was
  # just built. It needs no access to the VM: the check is made from outside,
  # against the same URL a user hits.
  verify-rollout:
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Wait for the running container to report this commit
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::NEXT_PUBLIC_APP_URL is not set, so the rollout cannot be verified."
            exit 1
          fi

          # Must match getBuildVersion() in src/lib/buildInfo.ts.
          expected="$(printf '%s' "$COMMIT_SHA" | cut -c1-12 | tr '[:upper:]' '[:lower:]')"

          # jq is present on GitHub's runners, but this job's whole value is that
          # its verdict can be trusted. A missing tool must not be reported as a
          # failed rollout, so fall back to sed rather than letting the pipeline
          # swallow the error and blame the VM.
          read_version() {
            if command -v jq >/dev/null 2>&1; then
              jq -r '.version // empty' 2>/dev/null
            else
              sed -n 's/.*"version":"\([^"]*\)".*/\1/p'
            fi
          }

          # Whether the running image can actually sign anyone in. Absent on any
          # image built before this check existed, which reads as empty and is
          # deliberately not treated as a failure -- an old image has no opinion.
          read_auth() {
            if command -v jq >/dev/null 2>&1; then
              # NOT `.integrations.auth // empty`. jq's // treats false as unset,
              # so that form returns empty for auth:false -- the one case this
              # check exists to catch -- and the gate would pass silently.
              jq -r 'if (.integrations | has("auth")) then (.integrations.auth | tostring) else "" end' 2>/dev/null
            else
              sed -n 's/.*"auth":\(true\|false\).*/\1/p'
            fi
          }

          # Watchtower polls every WATCHTOWER_POLL_INTERVAL seconds (300 by
          # default), so 12 minutes gives it at least two chances plus time to
          # pull an ARM image and restart.
          deadline=$(( SECONDS + 720 ))
          attempt=0
          reported="unreachable"

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))

            body="$(curl -fsS --max-time 15 "${APP_URL%/}/api/health" 2>/dev/null || true)"
            if [ -z "$body" ]; then
              live=""
              reported="unreachable"
            else
              live="$(printf '%s' "$body" | read_version)"
              # An old container has no version field at all, which is a
              # different fact from the host being down. Say which.
              reported="${live:-serving-a-build-with-no-version}"
            fi

            if [ -n "$live" ] && [ "$live" = "$expected" ]; then
              echo "::notice::Rollout confirmed after ${SECONDS}s — ${APP_URL} is serving ${expected}."

              # Shipping is not the same as working, in the same way that
              # publishing was not the same as shipping. An image that reaches
              # the VM before the Auth.js variables are set boots, serves pages
              # and reports healthy while nobody can log in -- so a green deploy
              # here would be the second lie this job exists to stop telling.
              auth="$(printf '%s' "$body" | read_auth)"

              if [ "$auth" = "false" ]; then
                echo "::error::${APP_URL} is serving ${expected}, but it cannot sign anyone in."
                echo "::error::The Auth.js environment variables are not set on the VM. The container log names the missing ones; it does not publish them, because /api/health is public."
                echo "::error::Set AUTH_SECRET, AUTH_ADAPTER_SECRET and AUTH_JWT_PRIVATE_KEY / AUTH_JWT_PUBLIC_KEY / AUTH_JWT_KID, then redeploy. AUTH_ADAPTER_SECRET must be the SAME value in the Convex environment."
                exit 1
              fi

              exit 0
            fi

            echo "attempt ${attempt} (${SECONDS}s): live=${reported} expected=${expected}"
            sleep 30
          done

          echo "::error::The image was published but ${APP_URL} is still ${reported}, not ${expected}."
          echo "::error::Nothing pulled it. Watchtower is defined in docker-compose.yml but has to be created once, and naming a single service will NOT create it: 'docker compose up -d app' touches app alone, and Watchtower is not one of its dependencies. That ships this commit by hand and leaves the next merge stuck in exactly the same way."
          echo "::error::To fix the cause, on the VM: 'docker compose pull && docker compose up -d' with no service name. Or in Portainer, Stacks -> commit -> Update the stack with 'Re-pull image' enabled."
          echo "::error::Either one recreates every container whose definition has drifted, not just app, so a live interview call will be dropped — pick a quiet moment."
          echo "::error::Then confirm with 'docker ps --filter name=commit-watchtower'. Until that container is running, every merge will build green and reach nobody."
          exit 1
