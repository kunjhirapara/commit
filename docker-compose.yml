# Portainer deployment via GitHub Container Registry
# 1. GitHub Actions builds the image and pushes to ghcr.io
# 2. In Portainer: Stacks → Add Stack → "Repository" build method
# 3. Set all environment variables in the Portainer stack env editor
# 4. Host nginx proxies commit.kunjdeveloper.me → 127.0.0.1:3000

services:
  app:
    image: ghcr.io/kunjhirapara/commit:${IMAGE_TAG:-latest}
    container_name: commit
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production

      # Clerk — authentication
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}

      # Convex — backend / database
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
      CONVEX_DEPLOYMENT: ${CONVEX_DEPLOYMENT}

      # Stream — video / realtime
      NEXT_PUBLIC_STREAM_API_KEY: ${NEXT_PUBLIC_STREAM_API_KEY}
      STREAM_SECRET_KEY: ${STREAM_SECRET_KEY}

      # SMTP — email notifications
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}

      # App
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

    volumes:
      # Required: app spawns isolated Docker containers for code execution
      - /var/run/docker.sock:/var/run/docker.sock

    # Host is 4 cores / 24 GB. Code-runner containers are siblings on the host
    # daemon, not children of this container, so they are NOT covered by this
    # limit — they get their own caps in src/lib/docker-runner.ts (0.5 CPU,
    # 128 MB each, max 3 concurrent). Budget is roughly:
    #   app 2.0 + runners 1.5 + backup 0.5 = 4.0 cores.
    cpus: 2.0
    mem_limit: 4g

    # Without rotation a public launch fills the 200 GB disk with JSON logs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Opts this container into Watchtower. Only app and backup carry it, so the
    # pinned monitoring images are never touched.
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  backup:
    image: ghcr.io/kunjhirapara/commit:${IMAGE_TAG:-latest}
    container_name: commit-backup
    restart: unless-stopped
    working_dir: /app/backup-worker
    command: ["node", "--experimental-strip-types", "scripts/backup-job.ts"]
    environment:
      NODE_ENV: production

      # Convex CLI — needs deploy key for non-interactive `convex export`
      CONVEX_DEPLOYMENT: ${CONVEX_DEPLOYMENT}
      CONVEX_DEPLOY_KEY: ${CONVEX_DEPLOY_KEY}

      # Snapshot reporting back into the app's reliability dashboard
      NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

      # Schedule / retention (override via Portainer env if needed)
      BACKUP_DIR: /data/backups
      BACKUP_CRON: ${BACKUP_CRON:-0 0 * * *}
      BACKUP_TZ: ${BACKUP_TZ:-UTC}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-0}

    volumes:
      # Named volume so backups survive stack recreation and image redeploys.
      # Inspect host path with: docker volume inspect commit_backup-data
      - backup-data:/data/backups

    # Idle most of the day; only needs headroom during the nightly convex export.
    cpus: 0.5
    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Shares the app image, so it must roll forward with it.
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Automatic image rollout ─────────────────────────────────────────────────
  # Portainer's stack webhook — the usual way to have CI trigger a redeploy — is
  # a Business Edition feature, so this pulls instead of being pushed to.
  # Watchtower polls GHCR and recreates a container when its image changes.
  #
  # Chosen over SSHing from GitHub Actions because it needs no inbound access:
  # the VM currently exposes only HTTP, and opening SSH to GitHub's runners plus
  # storing a private key as a repo secret is real new attack surface for a
  # convenience. The cost is polling latency instead of an instant push.
  #
  # The GHCR package is public, so no registry credentials are needed. If it is
  # ever made private, add REPO_USER and REPO_PASS (a PAT with read:packages).
  #
  # Scoped by label, not global: without WATCHTOWER_LABEL_ENABLE it would also
  # manage Prometheus, Grafana, cAdvisor and node-exporter, which are pinned to
  # exact versions on purpose.
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: commit-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      # Removes the image a container was running once it has been replaced.
      # This is the main source of the dangling images image-gc otherwise sweeps.
      WATCHTOWER_CLEANUP: "true"
      # Don't take the stack down together: containers are updated one at a time.
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    cpus: 0.25
    mem_limit: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Image cleanup ───────────────────────────────────────────────────────────
  # Backstop to Watchtower's own WATCHTOWER_CLEANUP, which only reclaims images
  # for containers it updated. This catches everything else: a manual
  # `docker compose pull`, a half-finished pull, an image left behind by a
  # container Watchtower does not manage.
  #
  # Superseded app images lose their only local tag when a new :latest arrives,
  # so they become dangling and are never reclaimed on their own. Left alone,
  # redeploys slowly fill the 200 GB disk.
  #
  # Prunes DANGLING images only. Deliberately not `prune -a`, which removes any
  # image without a *running* container — that would delete node:20-alpine,
  # python:3.12-alpine and eclipse-temurin:21-alpine between code runs, forcing a
  # fresh pull on every execution and making the runner far slower.
  #
  # This mounts the Docker socket, which is root-equivalent on the host. The app
  # container already mounts it for the code runner, so this adds no new class of
  # access — but if you would rather not have a second container holding it, drop
  # this service and put `0 4 * * * docker image prune -f` in the host crontab
  # instead. Same effect.
  image-gc:
    image: docker:27-cli
    container_name: commit-image-gc
    restart: unless-stopped
    command: >
      sh -c 'while true; do
        docker image prune -f || true;
        sleep "${IMAGE_GC_INTERVAL_SECONDS:-86400}";
      done'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    # Sleeps almost all the time; the prune itself is I/O, not CPU.
    cpus: 0.25
    mem_limit: 128m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Host metrics ────────────────────────────────────────────────────────────
  # Answers "what can this box actually take?" — the in-app dashboard covers user
  # inflow, these cover CPU, memory, disk and per-container load. All bound to
  # 127.0.0.1: only the host nginx should be able to reach them.
  #
  # Start with: docker compose --profile monitoring up -d
  # Omit the profile and the stack runs exactly as before.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: commit-node-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    cpus: 0.15
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: commit-cadvisor
    restart: unless-stopped
    profiles: ["monitoring"]
    # Per-container CPU/memory — this is what shows whether code-runner
    # containers are crowding out the app.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    ports:
      - "127.0.0.1:8080:8080"
    cpus: 0.25
    mem_limit: 320m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: commit-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      # Hard ceiling so metrics can never fill the 200 GB disk.
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    cpus: 0.4
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  grafana:
    image: grafana/grafana:11.2.0
    container_name: commit-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Set GRAFANA_ADMIN_PASSWORD in the Portainer stack env before exposing
      # Grafana anywhere. A plain default is used rather than `:?` because
      # Compose interpolates every variable regardless of active profiles, so a
      # required-variable marker here would break the base stack too.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    cpus: 0.3
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  backup-data:
  prometheus-data:
  grafana-data:
