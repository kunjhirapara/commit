# Reference config for the HOST nginx — this repo's compose stack has no nginx
# service. The app publishes on 127.0.0.1:3000 and the host terminates TLS and
# proxies to it.
#
# Nothing in this repo mounts or reads this file. Copy it to /etc/nginx/conf.d/
# on the VM and adjust server_name, or just use it as a reference. The previous
# version pointed at `server app:3000`, which only resolves from inside a compose
# network, so it could never have worked against this stack.

upstream commit_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Grafana, present only while the monitoring compose profile is running.
upstream commit_grafana {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name commit.kunjdeveloper.me;

    # Stays on plain HTTP so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name commit.kunjdeveloper.me;

    ssl_certificate     /etc/letsencrypt/live/commit.kunjdeveloper.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commit.kunjdeveloper.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    # Long timeouts for SSE / WebSocket connections (Convex, Stream.io)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # next.config.mjs sets this too; repeating it here covers redirects and error
    # pages that nginx serves without ever reaching the app.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Health check passthrough
    location = /api/health {
        proxy_pass http://commit_app;
        access_log off;
    }

    location / {
        proxy_pass http://commit_app;
        proxy_http_version 1.1;

        # WebSocket / upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
    }
}

# Grafana on its own subdomain, once certs exist for it. Prometheus is
# deliberately absent: it has no authentication of its own and should stay
